  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ReNamery",
      "alternateName": "リネーマリー",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Windows, Android, Web",
      "url": "https://toyo-craft.net/apps",
      "description": "ReNameryは、ローカルフォルダ内のファイル名を安全にプレビューしながら一括変更できる東洋クラフト提供のリネーム支援アプリです。",
      "image": "https://toyo-craft.net/apps/icons/Icon-512.png",
      "author": {
        "@type": "Organization",
        "name": "東洋クラフト",
        "url": "https://toyo-craft.net/"
      },
      "publisher": {
        "@type": "Organization",

      }
    }
  </script>
</head>
<body>
  <script>
    (() => {
      const dbName = 'renamery-web-fs';
      const storeName = 'directories';

      const requestToPromise = (request) => new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const openDb = () => new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const isSupported = () => Boolean(
        window.isSecureContext &&
        window.showDirectoryPicker &&
        window.indexedDB
      );

      const safeUuid = () => {
        if (window.crypto && window.crypto.randomUUID) {
          return window.crypto.randomUUID();
        }
        return `dir-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      };

      const withPermission = async (record) => {
        let permission = 'prompt';
        try {
          permission = await record.handle.queryPermission({ mode: 'readwrite' });
        } catch (_) {}
        return {
          id: record.id,
          name: record.name,
          handle: record.handle,
          permission,
          lastUsedAt: record.lastUsedAt || 0,
        };
      };

      const getRecords = async () => {
        if (!isSupported()) return [];
        const db = await openDb();
        const transaction = db.transaction(storeName, 'readonly');
        const records = await requestToPromise(transaction.objectStore(storeName).getAll());
        db.close();
        return records || [];
      };

      const putRecord = async (record) => {
        const db = await openDb();
        const transaction = db.transaction(storeName, 'readwrite');
        await requestToPromise(transaction.objectStore(storeName).put(record));
        db.close();
      };

      const deleteRecord = async (id) => {
        const db = await openDb();
        const transaction = db.transaction(storeName, 'readwrite');
        await requestToPromise(transaction.objectStore(storeName).delete(id));
        db.close();
      };

      const saveDirectoryHandle = async (handle) => {
        const records = await getRecords();
        let existing = null;
        for (const record of records) {
          try {
            if (await record.handle.isSameEntry(handle)) {
              existing = record;
              break;
            }
          } catch (_) {}
        }
        const record = {
          id: existing ? existing.id : safeUuid(),
          name: handle.name,
          handle,
          lastUsedAt: Date.now(),
        };
        await putRecord(record);
        return withPermission(record);
      };

      const pickDirectory = async () => {
        if (!isSupported()) {
          throw new Error('File System Access API is not supported.');
        }
        let handle = null;
        try {
          handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        } catch (error) {
          if (error?.name === 'AbortError') return null;
          throw error;
        }
        return saveDirectoryHandle(handle);
      };

      let externalDropBounds = null;
      let externalDropCallback = null;

      const emitExternalDrop = (result) => {
        if (typeof externalDropCallback !== 'function') return;
        try {
          externalDropCallback(result);
        } catch (_) {}
      };

      const isInsideExternalDropBounds = (event) => {
        if (!externalDropBounds) return false;
        return event.clientX >= externalDropBounds.left &&
          event.clientX <= externalDropBounds.right &&
          event.clientY >= externalDropBounds.top &&
          event.clientY <= externalDropBounds.bottom;
      };

      const rejectExternalDrop = (message) => {
        emitExternalDrop({ status: 'rejected', message });
      };

      const handleExternalDrop = async (event) => {
        if (!isInsideExternalDropBounds(event)) return;
        event.preventDefault();
        event.stopPropagation();

        const items = Array.from(event.dataTransfer?.items || [])
          .filter((item) => item.kind === 'file');
        if (items.length !== 1) {
          rejectExternalDrop('フォルダを1つだけドロップしてください。');
          return;
        }

        const item = items[0];
        if (typeof item.getAsFileSystemHandle !== 'function') {
          rejectExternalDrop('このブラウザではフォルダのドラッグ&ドロップに対応していません。');
          return;
        }

        try {
          const handle = await item.getAsFileSystemHandle();
          if (!handle || handle.kind !== 'directory') {
            rejectExternalDrop('ファイルではなくフォルダを1つだけドロップしてください。');
            return;
          }
          const directory = await saveDirectoryHandle(handle);
          emitExternalDrop({ status: 'accepted', directory });
        } catch (error) {
          rejectExternalDrop(error?.message || 'フォルダを開けませんでした。');
        }
      };

      document.addEventListener('dragover', (event) => {
        if (!isInsideExternalDropBounds(event)) return;
        event.preventDefault();
        event.stopPropagation();
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
      });

      document.addEventListener('drop', (event) => {
        handleExternalDrop(event);
      });

      window.renameryExternalDrop = {
        setBounds: (left, top, right, bottom) => {
          externalDropBounds = { left, top, right, bottom };
        },
        setDropCallback: (callback) => {
          externalDropCallback = callback;
        },
        clearDropCallback: (callback) => {
          if (externalDropCallback === callback) externalDropCallback = null;
        },
      };

      const listSavedDirectories = async () => {
        const records = await getRecords();
        const result = [];
        for (const record of records) {
          result.push(await withPermission(record));
        }
        result.sort((a, b) => (b.lastUsedAt || 0) - (a.lastUsedAt || 0));
        return result;
      };

      const forgetSavedDirectory = async (id) => {
        if (!isSupported()) return;
        await deleteRecord(id);
      };

      const requestDirectoryPermission = async (handle) => {
        const options = { mode: 'readwrite' };
        let permission = await handle.queryPermission(options);
        if (permission !== 'granted') {
          permission = await handle.requestPermission(options);
        }
        return permission;
      };

      const ensureDirectoryPermission = async (handle) => {
        const permission = await requestDirectoryPermission(handle);
        if (permission !== 'granted') {
          throw new Error('Directory permission was not granted.');
        }
      };

      const listDirectory = async (handle, relativePath = '', recursive = false) => {
        await ensureDirectoryPermission(handle);
        const result = [];

        const appendEntries = async (parentHandle, parentRelativePath) => {
          const children = [];
          for await (const [name, child] of parentHandle.entries()) {
            children.push({ name, child });
          }
          children.sort((a, b) => {
            if (a.child.kind !== b.child.kind) return a.child.kind === 'directory' ? -1 : 1;
            return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
          });

          for (const { name, child } of children) {
            let size = null;
            let lastModified = null;
            if (child.kind === 'file') {
              try {
                const file = await child.getFile();
                size = file.size;
                lastModified = file.lastModified;
              } catch (_) {}
            }
            const childRelativePath = parentRelativePath ? `${parentRelativePath}/${name}` : name;
            result.push({
              name,
              kind: child.kind,
              handle: child,
              parentHandle,
              relativePath: childRelativePath,
              size,
              lastModified,
            });
            if (recursive && child.kind === 'directory') {
              await appendEntries(child, childRelativePath);
            }
          }
        };

        await appendEntries(handle, relativePath);
        return result;
      };

      const isNotFoundError = (error) => error && error.name === 'NotFoundError';
      const isTypeMismatchError = (error) => error && error.name === 'TypeMismatchError';

      const assertNewNameAvailable = async (parentHandle, newName) => {
        try {
          await parentHandle.getFileHandle(newName);
          throw new Error(`An item named "${newName}" already exists.`);
        } catch (error) {
          if (isTypeMismatchError(error)) {
            throw new Error(`An item named "${newName}" already exists.`);
          }
          if (!isNotFoundError(error)) throw error;
        }
        try {
          await parentHandle.getDirectoryHandle(newName);
          throw new Error(`An item named "${newName}" already exists.`);
        } catch (error) {
          if (isTypeMismatchError(error)) {
            throw new Error(`An item named "${newName}" already exists.`);
          }
          if (isNotFoundError(error)) return;
          throw error;
        }
      };

      const copyFile = async (sourceHandle, targetDirectoryHandle, targetName) => {
        const file = await sourceHandle.getFile();
        const targetHandle = await targetDirectoryHandle.getFileHandle(targetName, { create: true });
        const writable = await targetHandle.createWritable();
        await writable.write(file);
        await writable.close();
      };

      const copyDirectory = async (sourceHandle, targetHandle) => {
        for await (const [name, child] of sourceHandle.entries()) {
          if (child.kind === 'file') {
            await copyFile(child, targetHandle, name);
          } else if (child.kind === 'directory') {
            const childTarget = await targetHandle.getDirectoryHandle(name, { create: true });
            await copyDirectory(child, childTarget);
          }
        }
      };

      const renameFile = async (parentHandle, oldName, newName) => {
        await ensureDirectoryPermission(parentHandle);
        if (!newName || newName.includes('/') || newName.includes('\\')) {
          throw new Error('Invalid file name.');
        }
        if (oldName === newName) return;
        await assertNewNameAvailable(parentHandle, newName);

        try {
          const sourceHandle = await parentHandle.getFileHandle(oldName);
          if (typeof sourceHandle.move === 'function') {
            try {
              await sourceHandle.move(newName);
              return;
            } catch (_) {
              // Fall through to copy-and-delete. Browser support for move() is uneven.
            }
          }
          await copyFile(sourceHandle, parentHandle, newName);
          await parentHandle.removeEntry(oldName);
          return;
        } catch (error) {
          if (!isNotFoundError(error) && !isTypeMismatchError(error)) throw error;
        }

        const sourceHandle = await parentHandle.getDirectoryHandle(oldName);
        if (typeof sourceHandle.move === 'function') {
          try {
            await sourceHandle.move(newName);
            return;
          } catch (_) {
            // Fall through to copy-and-delete. Browser support for move() is uneven.
          }
        }
        const targetHandle = await parentHandle.getDirectoryHandle(newName, { create: true });
        await copyDirectory(sourceHandle, targetHandle);
        await parentHandle.removeEntry(oldName, { recursive: true });
      };

      window.renameryFs = {
        isSupported,
        pickDirectory,
        listSavedDirectories,
        forgetSavedDirectory,
        requestDirectoryPermission,
        listDirectory,
        renameFile,
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
