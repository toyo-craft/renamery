name: ReNamery Full Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'

      # --- Windows ビルド ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter build windows --release
          
          # 1. ZIP版 (Portable) の作成
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ReNamery-${{ github.ref_name }}-windows-x64.zip
          
          # 2. MSIX (Store用) の作成
          $TAG_NAME = "${{ github.ref_name }}"
          $RAW_VER = $TAG_NAME.Replace("v", "")
          $MSIX_VER = "$RAW_VER.0"
          # Store用なので --install-certificate は不要だが、CIエラー防止のため false 指定
          dart run msix:create --display-name="ReNamery" --publisher-display-name="Toyo Craft Lab" --version=$MSIX_VER --output-path="." --output-name="ReNamery-${{ github.ref_name }}-windows-x64" --install-certificate false

          # 3. MSI (Standard Installer) の作成
          # WiX Toolset を使用して MSI を作成するための最低限の WXS ファイルを生成
          $WXS_CONTENT = @"
          <?xml version='1.0' encoding='windows-1252'?>
          <Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>
              <Product Name='ReNamery' Id='*' UpgradeCode='7eb57432-8432-4234-8432-1234567890ab'
                  Language='1033' Codepage='1252' Version='$RAW_VER' Manufacturer='Toyo Craft Lab'>
                  <Package Id='*' Keywords='Installer' Description="ReNamery Installer"
                      Comments='ReNamery' Manufacturer='Toyo Craft Lab'
                      InstallerVersion='100' Languages='1033' Compressed='yes' SummaryCodepage='1252' />
                  <Media Id='1' Cabinet='Sample.cab' EmbedCab='yes' DiskPrompt="CD-ROM #1" />
                  <Property Id='DiskPrompt' Value="ReNamery Installation [1]" />
                  <Directory Id='TARGETDIR' Name='SourceDir'>
                      <Directory Id='ProgramFiles64Folder' Name='PFiles'>
                          <Directory Id='INSTALLDIR' Name='ReNamery'>
                              <Component Id='MainExecutable' Guid='*'>
                                  <File Id='ReNameryEXE' Name='renamery.exe' DiskId='1' Source='build\windows\x64\runner\Release\renamery.exe' KeyPath='yes'>
                                      <Shortcut Id="startmenuReNamery" Directory="ProgramMenuDir" Name="ReNamery" WorkingDirectory='INSTALLDIR' Icon="renamery.exe" IconIndex="0" Advertise="yes" />
                                      <Shortcut Id="desktopReNamery" Directory="DesktopFolder" Name="ReNamery" WorkingDirectory='INSTALLDIR' Icon="renamery.exe" IconIndex="0" Advertise="yes" />
                                  </File>
                              </Component>
                              <Component Id='FlutterEngine' Guid='*'>
                                  <File Id='FlutterEngineDLL' Name='flutter_windows.dll' DiskId='1' Source='build\windows\x64\runner\Release\flutter_windows.dll' KeyPath='yes' />
                              </Component>
                              <Component Id='AppDataDir' Guid='*'>
                                  <File Id='DataDir' Name='data' DiskId='1' Source='build\windows\x64\runner\Release\data' KeyPath='yes' />
                              </Component>
                          </Directory>
                      </Directory>
                      <Directory Id="ProgramMenuFolder" Name="Programs">
                          <Directory Id="ProgramMenuDir" Name="ReNamery">
                              <Component Id="ProgramMenuDir" Guid="*">
                                  <RemoveFolder Id='ProgramMenuDir' On='uninstall' />
                                  <RegistryValue Root='HKCU' Key='Software\ToyoCraftLab\ReNamery' Type='string' Value='' KeyPath='yes' />
                              </Component>
                          </Directory>
                      </Directory>
                      <Directory Id="DesktopFolder" Name="Desktop" />
                  </Directory>
                  <Feature Id='MainFeature' Title='Main Feature' Level='1'>
                      <ComponentRef Id='MainExecutable' />
                      <ComponentRef Id='FlutterEngine' />
                      <ComponentRef Id='ProgramMenuDir' />
                  </Feature>
                  <Icon Id="renamery.exe" SourceFile="build\windows\x64\runner\Release\renamery.exe" />
              </Product>
          </Wix>
          "@
          $WXS_CONTENT | Out-File -FilePath "renamery.wxs" -Encoding ascii
          # WiX の candle と light を実行して MSI を生成
          candle renamery.wxs
          light -ext WixUIExtension renamery.wixobj -o ReNamery-${{ github.ref_name }}-windows-x64.msi

      # --- Android ビルド ---
      - name: Build Android
        if: matrix.os == 'windows-latest'
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk ReNamery-${{ github.ref_name }}-android-universal.apk

      # --- Linux ビルド ---
      - name: Build Linux and Debian Package
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev pkg-config
          chmod +x scripts/package_debian.sh
          ./scripts/package_debian.sh
          # ポータブル版の作成（スクリプト内のビルド成果物を使用）
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../ReNamery-${{ github.ref_name }}-linux-x64.tar.gz .

      # --- GitHub へのアップロード ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ReNamery-${{ github.ref_name }}-windows-x64.zip
            ReNamery-${{ github.ref_name }}-windows-x64.msi
            ReNamery-${{ github.ref_name }}-windows-x64.msix
            ReNamery-${{ github.ref_name }}-android-universal.apk
            ReNamery-${{ github.ref_name }}-linux-x64.tar.gz
            build/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
