name: ReNamery Full Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'

      # --- Windows ビルド ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ReNamery_Windows_Portable.zip

      # --- Android ビルド ---
      - name: Build Android
        if: matrix.os == 'windows-latest'
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk ReNamery_Android.apk

      # --- Linux ビルド ---
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev pkg-config
          flutter build linux --release
          # Debian パッケージの作成
          flutter pub get
          flutter pub run debian:create
          # ポータブル版の作成
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../ReNamery_Linux_Portable.tar.gz .

      # --- GitHub へのアップロード ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ReNamery_Windows_Portable.zip
            ReNamery_Android.apk
            ReNamery_Linux_Portable.tar.gz
            build/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
