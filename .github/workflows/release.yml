name: ReNamery Full Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'

      # --- Windows ビルド ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter build windows --release
          
          # 1. ZIP版 (Portable) の作成
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ReNamery-${{ github.ref_name }}-windows-x64.zip
          
          # 2. MSIX (Store用) の作成
          $TAG_NAME = "${{ github.ref_name }}"
          $RAW_VER = $TAG_NAME.Replace("v", "")
          $MSIX_VER = "$RAW_VER.0"
          dart run msix:create --display-name="ReNamery" --publisher-display-name="Toyo Craft Lab" --version=$MSIX_VER --output-path="." --output-name="ReNamery-${{ github.ref_name }}-windows-x64" --install-certificate false

          # 3. MSI (Standard Installer) の作成
          # heat.exe でディレクトリ構造をスキャン
          heat dir build\windows\x64\runner\Release -cg AppFiles -gg -scom -sreg -sfrag -srd -dr INSTALLDIR -template fragment -arch x64 -out AppFiles.wxs

          # ライセンスファイル (RTF形式) の生成
          # docs\License定義.md に基づく統合ライセンスドキュメント
          $EULA_CONTENT = @"
          {\rtf1\ansi\deff0{\fonttbl{\f0 Arial;}{\f1 Segoe UI;}}
          {\colortbl ;\red0\green0\blue255;}
          \f1\fs24\b ReNamery End User License Agreement\b0\fs20\par\par
          
          \b 1. INSTALLER CONSENT NOTICE\b0\par
          Please read the following before installing or using ReNamery.\par
          By downloading, installing, launching, or using ReNamery, you acknowledge and agree that:\par
          - ReNamery is provided under the BSD 3-Clause License.\par
          - Provided on an "AS IS" basis, without warranties of any kind.\par
          - Toyo Craft Lab shall not be liable for any damages arising out of use.\par
          - ReNamery may access the network for updates and version info.\par\par

          \b 2. BSD 3-CLAUSE LICENSE\b0\par
          Copyright (c) 2026, Toyo Craft Lab. All rights reserved.\par
          Redistribution and use in source and binary forms, with or without modification, are permitted provided that the conditions in the full BSD 3-Clause License are met.\par\par

          \b 3. TERMS OF USE & PRIVACY POLICY\b0\par
          Additional terms and privacy policies apply to your use of this software. \par
          The full text of the Terms of Use and Privacy Policy can be found in the documentation provided with this application or on the official distribution page.\par\par
          
          If you do not agree to these terms, do not install or use ReNamery.
          }
          "@
          $EULA_CONTENT | Out-File -FilePath "license.rtf" -Encoding ascii

          $MAIN_WXS = @"
          <?xml version='1.0' encoding='windows-1252'?>
          <Wix xmlns='http://schemas.microsoft.com/wix/2006/wi' xmlns:util='http://schemas.microsoft.com/wix/UtilExtension'>
              <Product Name='ReNamery' Id='*' UpgradeCode='7eb57432-8432-4234-8432-1234567890ab'
                  Language='1033' Codepage='1252' Version='$RAW_VER' Manufacturer='Toyo Craft Lab'>
                  <Package Id='*' Keywords='Installer' Description="ReNamery Installer"
                      Comments='ReNamery' Manufacturer='Toyo Craft Lab'
                      InstallerVersion='200' Languages='1033' Compressed='yes' SummaryCodepage='1252' Platform='x64' />
                  
                  <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
                  <Media Id='1' Cabinet='App.cab' EmbedCab='yes' />

                  <Icon Id="AppIcon" SourceFile="build\windows\x64\runner\Release\renamery.exe" />
                  <Property Id="ARPPRODUCTICON" Value="AppIcon" />

                  <WixVariable Id="WixUILicenseRtf" Value="license.rtf" />

                  <Directory Id='TARGETDIR' Name='SourceDir'>
                      <Directory Id='ProgramFiles64Folder'>
                          <Directory Id='INSTALLDIR' Name='ReNamery' />
                      </Directory>
                      <Directory Id="ProgramMenuFolder">
                          <Directory Id="ProgramMenuDir" Name="ReNamery">
                              <Component Id="ProgramMenuDirComp" Guid="*" Win64="yes">
                                  <RemoveFolder Id='ProgramMenuDir' On='uninstall' />
                                  <RegistryValue Root='HKCU' Key='Software\ToyoCraftLab\ReNamery' Type='string' Value='' KeyPath='yes' />
                              </Component>
                          </Directory>
                      </Directory>
                      <Directory Id="DesktopFolder" Name="Desktop" />
                  </Directory>

                  <Feature Id='MainFeature' Title='Main Feature' Level='1'>
                      <ComponentGroupRef Id='AppFiles' />
                      <ComponentRef Id='ProgramMenuDirComp' />
                      <ComponentRef Id='ApplicationShortcut' />
                      <ComponentRef Id='ApplicationShortcutDesktop' />
                  </Feature>

                  <DirectoryRef Id="ProgramMenuDir">
                      <Component Id="ApplicationShortcut" Guid="*" Win64="yes">
                          <Shortcut Id="ApplicationStartMenuShortcut" Name="ReNamery" Description="ReNamery" Target="[INSTALLDIR]renamery.exe" WorkingDirectory="INSTALLDIR" Icon="AppIcon" />
                          <RegistryValue Root="HKCU" Key="Software\ToyoCraftLab\ReNamery" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                      </Component>
                  </DirectoryRef>

                  <DirectoryRef Id="DesktopFolder">
                      <Component Id="ApplicationShortcutDesktop" Guid="*" Win64="yes">
                          <Shortcut Id="ApplicationDesktopShortcut" Name="ReNamery" Description="ReNamery" Target="[INSTALLDIR]renamery.exe" WorkingDirectory="INSTALLDIR" Icon="AppIcon" />
                          <RegistryValue Root="HKCU" Key="Software\ToyoCraftLab\ReNamery" Name="installed_desktop" Type="integer" Value="1" KeyPath="yes" />
                      </Component>
                  </DirectoryRef>

                  <Property Id="WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT" Value="Launch ReNamery" />
                  <Property Id="WixShellExecTarget" Value="[INSTALLDIR]renamery.exe" />
                  <CustomAction Id="LaunchApplication" BinaryKey="WixCA" DllEntry="WixShellExec" Impersonate="yes" />

                  <UI>
                      <UIRef Id="WixUI_Minimal" />
                      <Publish Dialog="ExitDialog" Control="Finish" Event="DoAction" Value="LaunchApplication">WIXUI_EXITDIALOGOPTIONALCHECKBOX</Publish>
                  </UI>
              </Product>
          </Wix>
          "@
          $MAIN_WXS | Out-File -FilePath "main.wxs" -Encoding ascii
          candle -arch x64 main.wxs AppFiles.wxs
          light -ext WixUIExtension -ext WixUtilExtension -b build\windows\x64\runner\Release main.wixobj AppFiles.wixobj -o ReNamery-${{ github.ref_name }}-windows-x64.msi

      # --- Android ビルド ---
      - name: Build Android
        if: matrix.os == 'windows-latest'
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk ReNamery-${{ github.ref_name }}-android-universal.apk

      # --- Linux ビルド ---
      - name: Build Linux and Debian Package
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev pkg-config
          chmod +x scripts/package_debian.sh
          ./scripts/package_debian.sh
          # ポータブル版の作成（スクリプト内のビルド成果物を使用）
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../ReNamery-${{ github.ref_name }}-linux-x64.tar.gz .

      # --- GitHub へのアップロード ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ReNamery-${{ github.ref_name }}-windows-x64.zip
            ReNamery-${{ github.ref_name }}-windows-x64.msi
            ReNamery-${{ github.ref_name }}-windows-x64.msix
            ReNamery-${{ github.ref_name }}-android-universal.apk
            ReNamery-${{ github.ref_name }}-linux-x64.tar.gz
            build/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
